name: Terraform

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # The module no longer configures providers, so it cannot be validated
      # from its own root — a root module has to supply them. The example does,
      # and validating it exercises the module through the same door a caller
      # uses. No backend and no credentials: this only type-checks.
      - name: terraform init
        working-directory: examples/complete
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: examples/complete
        run: terraform validate

  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Same hook as .pre-commit-config.yaml: fails when README.md is stale.
      - uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true
